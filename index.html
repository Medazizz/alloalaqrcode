<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#081B40" />
    <link rel="icon" type="image/png" href="/qrcode/logo.png" />
    <link rel="apple-touch-icon" href="/qrcode/logo.png" />
    <title>Allo..Ala — كلمني...نفضهالك</title>

    <meta name="description" content="Allo..Ala — livraison, commandes et services à Sbeïtla. Un appel suffit." />
    <link rel="canonical" href="https://alloala.com/qrcode/" />

    <!-- Aperçu quand le lien est partagé (WhatsApp, Facebook, Messenger…).
         Les adresses doivent être complètes, avec https:// -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Allo..Ala" />
    <meta property="og:url" content="https://alloala.com/qrcode/" />
    <meta property="og:title" content="Allo..Ala — كلمني...نفضهالك" />
    <meta property="og:description" content="Livraison et commandes à Sbeïtla. Un coup de fil, et le reste nous regarde." />
    <meta property="og:image" content="https://alloala.com/qrcode/logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Logo Allo..Ala" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Cairo:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Écran d'accueil : visible tout de suite, même si la connexion est lente.
         Affiché seulement à la première visite de la session. -->
    <script>
      try {
        var h = document.documentElement;
        if (sessionStorage.getItem("aa-splash") || matchMedia("(prefers-reduced-motion: reduce)").matches) {
          h.classList.add("no-splash");
        } else {
          sessionStorage.setItem("aa-splash", "1");
        }
      } catch (e) {}
    </script>
    <style>
      #splash{
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
        background: radial-gradient(600px 400px at 50% 45%, #12336B, #081B40 70%);
        color: #F3F6FC; font: 700 30px "Space Grotesk", system-ui, sans-serif; letter-spacing: -0.02em;
      }
      .no-splash #splash{ display: none; }
      #splash .sp-mark{ position: relative; width: 104px; height: 104px; }
      #splash .sp-mark img{
        position: relative; z-index: 1; width: 100%; height: 100%; border-radius: 26px; display: block;
        box-shadow: 0 18px 40px -12px rgba(0,0,0,.6);
        animation: sp-ring 1.1s ease-in-out infinite;
      }
      #splash .sp-wave{
        position: absolute; inset: 0; border-radius: 30px; border: 2px solid #FF8438;
        animation: sp-wave 1.1s ease-out infinite;
      }
      #splash .sp-wave.w2{ animation-delay: .35s; }
      #splash .sp-name span{ color: #FF8438; }
      #splash .sp-dots i{
        display: inline-block; font-style: normal; color: #FF8438;
        animation: sp-dot 1.1s ease-in-out infinite;
      }
      #splash .sp-dots i + i{ animation-delay: .18s; }
      #splash.out{ animation: sp-out .6s cubic-bezier(.7,0,.3,1) forwards; }
      @keyframes sp-ring{
        0%, 60%, 100%{ transform: rotate(0); }
        8%, 24%, 40%{ transform: rotate(-9deg); }
        16%, 32%, 48%{ transform: rotate(9deg); }
      }
      @keyframes sp-wave{ from{ transform: scale(1); opacity: .9; } to{ transform: scale(1.9); opacity: 0; } }
      @keyframes sp-dot{ 0%, 100%{ transform: none; opacity: .5; } 40%{ transform: translateY(-5px); opacity: 1; } }
      @keyframes sp-out{
        from{ clip-path: circle(150% at 50% 45%); }
        to{ clip-path: circle(0% at 50% 45%); }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-mark">
        <span class="sp-wave"></span>
        <span class="sp-wave w2"></span>
        <img src="/qrcode/logo.png" alt="" />
      </div>
      <div class="sp-name">Allo<span class="sp-dots"><i>.</i><i>.</i></span><span>Ala</span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Statistiques de visites (GoatCounter) : https://mohamedaziz.goatcounter.com
         Les scans du QR code sont comptés grâce à ?src=qr dans l'adresse du QR code. -->
    <script
      data-goatcounter="https://mohamedaziz.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </body>
</html>
